name: Deploy staging (GitHub Pages)

# El repo tiene Pages legacy: branch main, path /.
# Publicamos el contenido de dist/ en la raíz de main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-staging
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      VITE_YGGDRA_API_BASE: https://api.yggdra.cl/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publicar dist en la raíz de main
        run: |
          set -euo pipefail
          rm -rf assets
          cp -a dist/assets assets
          cp -f dist/index.html index.html
          cp -f dist/404.html 404.html
          cp -f dist/favicon.svg favicon.svg
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets index.html 404.html favicon.svg .nojekyll
          if git diff --staged --quiet; then
            echo "Sin cambios de publish"
          else
            git commit -m "chore: publish staging [skip ci]"
            git push origin HEAD:main
          fi

          # Espejo en gh-pages (por si se cambia el source después)
          TMP=$(mktemp -d)
          cp -a dist/. "$TMP/"
          touch "$TMP/.nojekyll"
          (
            cd "$TMP"
            git init
            git checkout -b gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Deploy staging"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git push -f origin gh-pages
          )
