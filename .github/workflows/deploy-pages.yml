name: Production (GitHub Pages)

# Forja no tiene dominio propio. Producción y staging publican el MISMO
# sitio de GitHub Pages (https://<owner>.github.io/forja/). El último push
# a `production` o a `dev` reemplaza al otro. No se inventa un FTP.
#
# `main` no despliega y ya no se commitea `dist/` en la rama.
#
# Primera vez: Settings → Pages → Source = GitHub Actions.
# El token del agente recibe 403 si intenta cambiar ese source. No se fuerza.
# Hasta ese cambio, este workflow falla al publicar y el Pages legacy
# (deploy from branch) sigue sirviendo lo último que se commiteó en main.

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_YGGDRA_API_BASE: https://api.yggdra.cl/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preparar artefactos de Pages
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
