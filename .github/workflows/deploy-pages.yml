name: Deploy staging (GitHub Pages)

# Pages del repo está en modo legacy: branch main, path /.
# Publicamos el build (assets + 404 + .nojekyll) en la raíz de main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'chore: publish staging [skip ci]'
    env:
      VITE_YGGDRA_API_BASE: https://api.yggdra.cl/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publicar assets en main (source de Pages)
        run: |
          set -e
          cp -a dist/assets/. assets/
          cp -f dist/404.html 404.html
          cp -f dist/favicon.svg favicon.svg
          touch .nojekyll
          # También mantener rama gh-pages alineada
          TMP=$(mktemp -d)
          cp -a dist/. "$TMP/"
          touch "$TMP/.nojekyll"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Push gh-pages
          (
            cd "$TMP"
            git init
            git checkout -b gh-pages
            git add -A
            git commit -m "Deploy staging"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git push -f origin gh-pages
          )

          # Commit en main si hay cambios de publish
          git add assets 404.html favicon.svg .nojekyll
          if git diff --staged --quiet; then
            echo "Sin cambios de publish"
            exit 0
          fi
          git commit -m "chore: publish staging [skip ci]"
          git push origin HEAD:main

      - name: Intentar deploy Actions (si algún día cambia a workflow)
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
